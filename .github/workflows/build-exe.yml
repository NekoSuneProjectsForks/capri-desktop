name: Build Windows exe

# Quick build: just Capri.exe and Capri-Setup.exe, no 35-minute smoke test.
on:
  push:
    branches: [main, fix/provider-connect]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build
        shell: pwsh
        run: ./ci/build-windows.ps1 -OutputDirectory out/windows
      - uses: actions/upload-artifact@v4
        with:
          name: Capri-windows-${{ github.ref_name == 'fix/provider-connect' && 'provider-connect' || github.ref_name }}-${{ github.sha }}
          path: |
            out/windows/Capri.exe
            out/windows/Capri-Setup.exe
          if-no-files-found: error
